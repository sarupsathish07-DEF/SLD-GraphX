[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["services/api/tests", "engine/sldgraph/tests", "sldforge/tests"]
markers = [
  "real_ocr: executes the isolated PaddleOCR worker",
  "real_detector: executes the isolated local symbol detector worker",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
